server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # 글로벌 CORS (게이트웨이 전담)
      # globalcors disabled for local testing

      # default-filters disabled for local testing

      routes:
        # 프리픽스 접근 유지
        - id: ordering-service-prefixed
          predicates:
            - Path=/ordering-service/**
          filters:
            - StripPrefix=1
          uri: lb://ordering-service

        - id: branch-service-prefixed
          predicates:
            - Path=/branch-service/**
          filters:
            - StripPrefix=1
          uri: lb://branch-service

        # 쇼핑몰 공개 인증
        - id: ordering-public-auth-shortcut
          predicates:
            - Path=/public/auth/customers/**
          uri: lb://ordering-service

        # 직원 공개 인증
        - id: branch-public-auth-shortcut
          predicates:
            - Path=/public/auth/employees/**
          uri: lb://branch-service

        # 고객 인증
        - id: ordering-auth-shortcut
          predicates:
            - Path=/auth/customers/**
          uri: lb://ordering-service

        # 자동 발주
        - id: branch-auto-order-apis
          predicates:
            - Path=/api/auto-order/**
          uri: lb://branch-service

        # 공개 상품/카테고리/재고 조회 등
        - id: ordering-public-apis
          predicates:
            - Path=/api/**, /inventory/**
          uri: lb://ordering-service

        # 본점 매출(HQ) API 직접 경로 지원
        - id: ordering-hq-sales
          predicates:
            - Path=/hq/sales/**
          uri: lb://ordering-service

        # branch-service 대시보드 API (ordering-service보다 먼저 매칭되도록)
        - id: branch-dashboard-apis
          predicates:
            - Path=/api/dashboard/branch/**
          uri: lb://branch-service

        # 직원 인증(/auth/**) — customers보다 뒤
        - id: branch-auth-shortcut
          predicates:
            - Path=/auth/**
          uri: lb://branch-service

        # 고객 마이페이지/탈퇴
        - id: ordering-customers-shortcut
          predicates:
            - Path=/customers/**
          uri: lb://ordering-service

        # 발주(구매요청)
        - id: branch-purchase-orders
          predicates:
            - Path=/purchase-orders/**
          uri: lb://branch-service

        # 직원(단·복수 경로 모두 지원)
        - id: branch-employees-shortcut
          predicates:
            - Path=/employee/**, /employees/**
          uri: lb://branch-service

    discovery:
      enabled: true

eureka:
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
    # 서비스 목록을 빠르게 갱신하여 503 에러 최소화
    registry-fetch-interval-seconds: 5  # 5초마다 레지스트리 갱신 (기본: 30초)
    initial-instance-info-replication-interval-seconds: 5  # 최초 등록 5초 후
  instance:
    prefer-ip-address: true
    # 하트비트를 빠르게 전송
    lease-renewal-interval-in-seconds: 5  # 5초마다 하트비트
    lease-expiration-duration-in-seconds: 10  # 10초 후 만료
